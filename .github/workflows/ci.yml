name: Verify & Deploy

# The whole point of this project: prove every snippet still compiles and runs
# against current Zig master. The nightly schedule is what turns "we tested it
# once" into "this is true today" — and, when it passes, republishes the site
# so the published version tracks the compiler without anyone doing anything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

# Publishing happens by pushing the built site to the `gh-pages` branch, which
# is what this repo's Pages settings serve. Do NOT switch to
# actions/deploy-pages without also changing Pages to "GitHub Actions" — the
# two mechanisms are mutually exclusive, and mixing them silently stops
# updating the live site.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Snippets compile & run on Zig master
    runs-on: ubuntu-latest
    # Job-level so the browser check sees the same prefix the site was built
    # with — a mismatch makes every page 404. Defaults target the custom
    # domain (web/public/CNAME) served at the root. Repo variables override,
    # e.g. BASE_PATH=/zig-guide/ to fall back to the github.io project site.
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.ziglang.in' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
    steps:
      # Full history, not the default single commit. `src/git-dates.ts` derives
      # every `lastmod` and every article `dateModified` from `git log`, and on
      # a shallow clone every file dates to the one commit that was fetched. It
      # detects that and emits no dates rather than 145 identical ones, so the
      # symptom of dropping this line is a sitemap that quietly loses the only
      # hint Google reads, with nothing failing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Snippets marked `//! link:<lib>` in build.zig are host builds that link
      # a system C library (the SQLite recipe links libsqlite3). The runner
      # needs the dev package so translate-c can read the header and the linker
      # can resolve the symbols. libx11-dev is for the graphics window chapter,
      # which is `//! norun`: it is linked but never executed, since it opens a
      # window and waits for a keypress. No X server is needed to build it.
      # The last five are for the raylib game in examples/lane-dodger, which is
      # a real desktop build and links the X libraries GLFW needs. No ALSA
      # package: raylib's audio backend resolves libasound at runtime rather
      # than including its header, so the game compiles without it and simply
      # stays silent where there is no device.
      - name: Install C libraries for linked snippets
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libsqlite3-dev zlib1g-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            xvfb

      # `master` resolves to the current nightly on every run, which is what
      # makes the schedule meaningful.
      #
      # Still on v2 while the other two are on v7: this action's newest release
      # (v2.2.1) declares the node20 runtime, which GitHub deprecated and now
      # force-runs on node24. There is no version of it to move to, so the
      # deprecation warning stays until upstream ships one.
      - uses: mlugg/setup-zig@v2
        with:
          version: master

      # Node 24, not 22. `zig build verify` executes every wasm snippet through
      # `node:wasi`, and on 22.23.1 the 06-cookbook.serialization-size module
      # segfaults the Node process about 1% of the time: 5 SEGVs in 400 runs.
      # The rate is the same for wasm built by Zig 1454 and by 1465 (3 in 200
      # each), so it is a V8/WASI bug, not snippet or compiler drift. Node 24.18
      # did not reproduce it in 700 runs. One failure in a hundred is invisible
      # for weeks and then fails the nightly on a tree that did not change,
      # which is the kind of false alarm that teaches people to ignore red.
      # The cache inputs are explicit rather than left to the automatic
      # detection v5 added: it keys on a `packageManager` field this repo does
      # not have, and would cache nothing while looking like it cached.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Record the Zig version under test
        run: |
          echo "Testing against Zig $(zig version)" >> "$GITHUB_STEP_SUMMARY"

      # Compiles every snippet to wasm32-wasi and executes it, comparing
      # against any .expected file. A stale API or wrong output fails here.
      - name: Verify snippets
        run: zig build verify

      - name: Emit wasm + manifest
        run: zig build

      # The game is a separate project with its own build, and it is here for
      # the same reason everything else is: to find out today whether Zig
      # master still compiles it. It is also the only thing in the repo that
      # links a large third-party C library, so it is the first place a
      # translate-c change shows up.
      #
      # What is *not* rebuilt here is the browser build. That needs the
      # Emscripten SDK, which would add ten minutes to every run, so the
      # artefacts under web/public/games/ are built by hand and committed, on
      # the same terms as og.png. The hazard is the obvious one: nothing here
      # notices if they fall behind the source. Rebuild them when the game
      # changes.
      - name: Vendor raylib
        working-directory: examples/lane-dodger
        run: ./fetch-raylib.sh

      - name: Test the game
        working-directory: examples/lane-dodger
        run: zig build test

      - name: Build the game
        working-directory: examples/lane-dodger
        run: zig build -Doptimize=ReleaseFast

      # Compiling proves the API still matches. Running proves it still draws.
      # The bot plays 600 frames against a virtual display and the process must
      # exit cleanly; sound is off, because the runner has no device and
      # opening one only fills the log with driver warnings.
      - name: Play the game headless
        working-directory: examples/lane-dodger
        run: |
          zig build -Dframes=600 -Ddemo=play
          xvfb-run -a -s "-screen 0 640x1100x24" ./zig-out/bin/lane-dodger

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        run: npx astro build

      # Proves the other half of the guarantee: that the published pages
      # actually execute the snippets in a real browser, that compile-only
      # blocks render without a Run button, and that no internal link 404s.
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify in a real browser
        working-directory: web
        run: npm run e2e

      # Only republish when everything above passed, so a compiler change that
      # breaks a snippet leaves the last good site up rather than shipping a
      # broken one.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Pages does not run Jekyll for us, and Jekyll would eat _astro/.
          touch web/dist/.nojekyll
          cd web/dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} (Zig $(zig version))"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published $(zig version) to gh-pages" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the URLs this deploy actually changed to IndexNow (Bing, Yandex,
      # Seznam, Naver) instead of waiting to be recrawled. Bing is the one that
      # matters most here: ChatGPT search reads its index.
      #
      # Only on a push, and only for what changed. The nightly has no diff, so
      # it submits nothing, which is correct: a rebuild against a new compiler
      # that changed no page is not news. Submitting every URL every night is
      # the documented way to get a host's submissions ignored.
      #
      # `continue-on-error` because the site is already published by the time
      # this runs. A 500 from someone else's API must not turn a good deploy red.
      - name: Notify IndexNow of changed URLs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          before="${{ github.event.before }}"
          # All-zeroes is a new branch, and a force-push can leave a `before`
          # that is no longer in the history. Fall back to the last commit.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="${GITHUB_SHA}~1"
          fi
          git diff --name-only "$before" "${GITHUB_SHA}" \
            | node web/tools/indexnow.mjs
